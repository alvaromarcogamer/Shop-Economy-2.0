# ==============================================================
#  MISIONES
#  Despues de editar este archivo usa  /misiones reload
#
#  TIPOS DE MISION
#    KILL_MOB     matar criaturas        (target = tipo de entidad, ej. ZOMBIE)
#    BREAK_BLOCK  romper bloques         (target = material, ej. DIAMOND_ORE)
#    PLACE_BLOCK  colocar bloques        (target = material)
#    FISH         pescar                 (no necesita target)
#    EAT          comer o beber          (target = material, ej. BREAD o ANY)
#    BREED        criar animales         (target = animal, ej. COW o ANY)
#
#  CAMPOS
#    name             nombre que se ve en el menu (admite colores con &)
#    description      lista de lineas de descripcion
#    type             uno de los tipos de arriba
#    target           ANY (cualquiera), un valor, o una lista de valores
#    amount           cuantas veces hay que hacerlo
#    icon             material del icono en el menu
#    repeatable       true = se puede volver a hacer al completarla
#    reward-text      texto de recompensa que se muestra al jugador
#    reward-money     dinero que recibe (necesita Vault y un plugin de economia, ej. ShopEconomy)
#    reward-commands  (opcional) comandos que ejecuta la consola. %player% = nombre del jugador
#    reward-items     objetos que recibe, formato MATERIAL:cantidad
# ==============================================================
quests:
  cazador_zombis:
    name: "&cCazador de zombis"
    description:
      - "&7Elimina a 20 zombis."
    type: KILL_MOB
    target: ZOMBIE
    amount: 20
    icon: ROTTEN_FLESH
    repeatable: false
    reward-text: "&e200 monedas"
    reward-money: 200

  huesos_y_flechas:
    name: "&fHuesos y flechas"
    description:
      - "&7Elimina a 15 esqueletos."
    type: KILL_MOB
    target: SKELETON
    amount: 15
    icon: BONE
    repeatable: false
    reward-text: "&e250 monedas"
